model: qwen-max
label: qwen-max
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 32768
max_output_tokens: 8192
attributes:
  model: qwen-max
parameters:
  - name: temperature
    label: 温度
    type: float
    help: 温度控制随机性，较低的温度会导致较少的随机生成。随着温度接近零，模型将变得更确定，较高的温度会导致更多随机内容被生成
    required: False
    min: 0
    max: 2
    default: 0.7
  - name: top_p
    label: Top P
    type: float
    help: 通过核心采样控制多样性，0.5表示考虑了一半的所有可能性加权选项
    required: False
    min: 0.0
    max: 1.0
    default: 0.8
    #存在惩罚
  - name: presence_penalty
    use_template: presence_penalty
    #频率惩罚
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    max: 8192
metadata:
  pricing:
    input: 0.1200
    output: 0.1200
    unit: 0.001
    currency: RMB