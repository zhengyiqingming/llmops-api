model: gpt-4o
label: gpt-4o
model_type: chat
features:
  - tool_call
  - agent_thought
  - image_input
context_window: 128000
max_output_tokens: 16384
attributes:
  model: gpt-4o
parameters:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
    #存在惩罚
  - name: presence_penalty
    use_template: presence_penalty
    #频率惩罚
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 4096
metadata:
  pricing:
    input: 0.0183
    output: 0.0733
    unit: 0.001
    currency: RMB